spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
  data:
    redis:
      timeout: 2000ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  messaging:
    provider: telegram
  ai:
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.7
    max-history-turns: 20
  conversation:
    session-ttl-minutes: 30
